<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="playing-cards.css" />
</head>

<body>
  <main id="playing-cards">
    <div class="card spade">
      <div class="left">
        <p>A</p>
        <p>&spades;</p>
      </div>
      <div class="middle">
        <p>&spades;</p>
      </div>
      <div class="right">
        <p>A</p>
        <p>&spades;</p>
      </div>
    </div>

    <div class="card club">
      <div class="left">
        <p>2</p>
        <p>&clubs;</p>
      </div>
      <div class="middle">
        <p>&clubs;</p>
        <p class="flip">&clubs;</p>
      </div>
      <div class="right">
        <p>2</p>
        <p>&clubs;</p>
      </div>
    </div>

    <div class="card heart">
      <div class="left">
        <p>3</p>
        <p>&hearts;</p>
      </div>
      <div class="middle">
        <p>&hearts;</p>
        <p>&hearts;</p>
        <p class="flip">&hearts;</p>
      </div>
      <div class="right">
        <p>3</p>
        <p>&hearts;</p>
      </div>
    </div>

    <div class="card club">
      <div class="left">
        <p>4</p>
        <p>&clubs;</p>
      </div>
      <div class="middle">
        <p>&clubs;&clubs;</p>
        <p class="flip">&clubs;&clubs;</p>
      </div>
      <div class="right">
        <p>4</p>
        <p>&clubs;</p>
      </div>
    </div>

    <div class="card diamond">
      <div class="left">
        <p>5</p>
        <p>&diams;</p>
      </div>
      <div class="middle">
        <p>&diams;&diams;</p>
        <p>&diams;</p>
        <p>&diams;&diams;</p>
      </div>
      <div class="right">
        <p>5</p>
        <p>&diams;</p>
      </div>
    </div>
  </main>
</body>

</html>
